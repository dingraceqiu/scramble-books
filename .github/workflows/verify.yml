name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: pnpm lint:build
      # 数据不变性回归：阅读状态 / 持久化 / Quiz 泄露 / KP 不变性 / Cloud Snapshot V1↔V2
      - name: Regression suites
        run: pnpm verify
