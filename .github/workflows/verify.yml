name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint:build
      # 数据不变性回归：阅读状态 / 持久化 / Quiz 泄露 / KP 不变性 / Cloud Snapshot V1↔V2
      - name: Regression suites
        run: pnpm verify

  # 运维脚本静态检查 + 故障注入测试（隔离 tmp 环境，不触碰真实 systemd/数据库）
  ops-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (if missing)
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
      - name: Shellcheck
        run: |
          shellcheck -S warning ops/systemd/scramble-books-key-rotation.sh ops/systemd/test-key-rotation.sh
      - name: Fault-injection tests (key rotation)
        run: |
          sudo bash ops/systemd/test-key-rotation.sh ops/systemd/scramble-books-key-rotation.sh
